<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requirements Questionnaire</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: #667eea;
            color: white;
            padding: 30px;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .progress-bar {
            background: #f3f4f6;
            padding: 20px;
        }
        
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 8px;
        }
        
        .progress-track {
            width: 100%;
            height: 8px;
            background: #d1d5db;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #667eea;
            transition: width 0.3s ease;
        }
        
        .content {
            padding: 40px;
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        
        .priority-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .priority-high {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .priority-medium {
            background: #fef3c7;
            color: #92400e;
        }
        
        .priority-low {
            background: #d1fae5;
            color: #065f46;
        }
        
        .info-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .info-button:hover {
            background: #5568d3;
        }
        
        .question-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 12px;
        }
        
        .question-description {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .options-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 16px;
        }
        
        .option {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }
        
        .option:hover {
            border-color: #667eea;
        }
        
        .option.selected {
            border-color: #667eea;
            background: #eef2ff;
        }
        
        .radio {
            width: 20px;
            height: 20px;
            border: 2px solid #d1d5db;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .option.selected .radio {
            border-color: #667eea;
            background: #667eea;
        }
        
        .radio-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            display: none;
        }
        
        .option.selected .radio-dot {
            display: block;
        }
        
        .option-text {
            color: #374151;
        }
        
        .option.selected .option-text {
            font-weight: 600;
            color: #4338ca;
        }
        
        .navigation {
            background: #f9fafb;
            padding: 24px 40px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e5e7eb;
        }
        
        .nav-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .nav-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .btn-prev {
            background: transparent;
            color: #374151;
        }
        
        .btn-prev:hover:not(:disabled) {
            color: #1f2937;
        }
        
        .btn-next {
            background: #667eea;
            color: white;
        }
        
        .btn-next:hover {
            background: #5568d3;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #1f2937;
        }
        
        .modal-text {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        
        .modal-button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .modal-button:hover {
            background: #5568d3;
        }
        
        .thank-you {
            display: none;
            text-align: center;
            padding: 60px 40px;
        }
        
        .thank-you.active {
            display: block;
        }
        
        .check-icon {
            width: 64px;
            height: 64px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: #065f46;
        }
        
        .thank-you h2 {
            font-size: 32px;
            margin-bottom: 16px;
            color: #1f2937;
        }
        
        .thank-you p {
            color: #6b7280;
            margin-bottom: 32px;
        }
        
        .download-button {
            background: #667eea;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        
        .download-button:hover {
            background: #5568d3;
        }
        
        .download-note {
            margin-top: 16px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Requirements Questionnaire</h1>
            <p>Please indicate the importance of each requirement</p>
        </div>
        
        <div class="progress-bar">
            <div class="progress-info">
                <span id="progress-text">Question 1 of 0</span>
                <span id="answered-text">0 answered</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        
        <div class="content" id="question-content">
            <div class="question-header">
                <span class="priority-badge" id="priority-badge"></span>
                <button class="info-button" id="info-button" style="display: none;">
                    ℹ️ More Info
                </button>
            </div>
            <h2 class="question-title" id="question-title"></h2>
            <p class="question-description" id="question-description"></p>
            <div class="options-label">Select importance level:</div>
            <div id="options-container"></div>
        </div>
        
        <div class="thank-you" id="thank-you">
            <div class="check-icon">✓</div>
            <h2>Thank You!</h2>
            <p id="completion-text"></p>
            <button class="download-button" onclick="downloadResults()">
                <span>⬇</span> Download Your Responses
            </button>
            <p class="download-note">The file will be saved as a CSV that you can email or import into other applications.</p>
        </div>
        
        <div class="navigation" id="navigation">
            <button class="nav-button btn-prev" id="prev-button" onclick="previousQuestion()">
                ← Previous
            </button>
            <button class="nav-button btn-next" id="next-button" onclick="nextQuestion()">
                <span id="next-text">Next</span> →
            </button>
        </div>
    </div>
    
    <div class="modal" id="comment-modal">
        <div class="modal-content">
            <h3 class="modal-title">Additional Information</h3>
            <p class="modal-text" id="modal-comment"></p>
            <button class="modal-button" onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script>
        let requirements = [];
        let currentPage = 0;
        let answers = {};
        
        const importanceOptions = [
            "Critical",
            "High",
            "Medium",
            "Low",
            "Not Applicable"
        ];
        
        // Load and parse CSV
        async function loadRequirements() {
            try {
                const csvData = await window.fs.readFile('slot-car-ecom-requirements.csv', { encoding: 'utf8' });
                Papa.parse(csvData, {
                    header: true,
                    dynamicTyping: false,
                    skipEmptyLines: true,
                    complete: function(results) {
                        requirements = results.data.filter(row => row.Name && row.Name.trim());
                        if (requirements.length > 0) {
                            renderQuestion();
                        }
                    }
                });
            } catch (error) {
                console.error('Error loading CSV:', error);
            }
        }
        
        function renderQuestion() {
            if (requirements.length === 0) return;
            
            const req = requirements[currentPage];
            
            document.getElementById('question-title').textContent = req.Name;
            document.getElementById('question-description').textContent = req.Description;
            
            const badge = document.getElementById('priority-badge');
            badge.textContent = `Original Priority: ${req.Priority}`;
            badge.className = 'priority-badge priority-' + req.Priority.toLowerCase();
            
            const infoButton = document.getElementById('info-button');
            if (req.comments && req.comments.trim()) {
                infoButton.style.display = 'flex';
            } else {
                infoButton.style.display = 'none';
            }
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            importanceOptions.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                if (answers[currentPage] === option) {
                    optionDiv.classList.add('selected');
                }
                optionDiv.onclick = () => selectOption(option);
                
                optionDiv.innerHTML = `
                    <div class="radio">
                        <div class="radio-dot"></div>
                    </div>
                    <span class="option-text">${option}</span>
                `;
                
                optionsContainer.appendChild(optionDiv);
            });
            
            updateProgress();
            updateNavigation();
        }
        
        function selectOption(option) {
            answers[currentPage] = option;
            renderQuestion();
        }
        
        function updateProgress() {
            const progress = ((currentPage + 1) / requirements.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `Question ${currentPage + 1} of ${requirements.length}`;
            document.getElementById('answered-text').textContent = `${Object.keys(answers).length} answered`;
        }
        
        function updateNavigation() {
            document.getElementById('prev-button').disabled = currentPage === 0;
            document.getElementById('next-text').textContent = currentPage === requirements.length - 1 ? 'Complete' : 'Next';
        }
        
        function previousQuestion() {
            if (currentPage > 0) {
                currentPage--;
                renderQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentPage < requirements.length - 1) {
                currentPage++;
                renderQuestion();
            } else {
                showThankYou();
            }
        }
        
        function showThankYou() {
            document.getElementById('question-content').style.display = 'none';
            document.getElementById('navigation').style.display = 'none';
            document.getElementById('thank-you').classList.add('active');
            document.getElementById('completion-text').textContent = 
                `You've completed the requirements questionnaire. You answered ${Object.keys(answers).length} out of ${requirements.length} questions.`;
        }
        
        function downloadResults() {
            const results = requirements.map((req, index) => {
                return {
                    Priority: req.Priority,
                    Requirement: req.Name,
                    Description: req.Description,
                    Comments: req.comments || '',
                    'Your Response': answers[index] || 'Not Answered'
                };
            });
            
            const csv = Papa.unparse(results);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `requirements_responses_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        document.getElementById('info-button').onclick = function() {
            const req = requirements[currentPage];
            document.getElementById('modal-comment').textContent = req.comments || '';
            document.getElementById('comment-modal').classList.add('active');
        };
        
        function closeModal() {
            document.getElementById('comment-modal').classList.remove('active');
        }
        
        loadRequirements();
    </script>
</body>
</html>
